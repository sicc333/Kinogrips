<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KINOGRIPS</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .logo {
            font-size: clamp(2.8rem, 9vw, 6.5rem);
            font-weight: 900;
            font-style: italic;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #ffffff;
            margin-bottom: 15px;
        }

        .subtitle {
            font-size: clamp(0.75rem, 2vw, 1rem);
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #71717a;
            margin-bottom: 50px;
        }

        .contact {
            font-size: 0.95rem;
            color: #a1a1aa;
            text-decoration: none;
            border-bottom: 1px solid #3f3f46;
            padding-bottom: 4px;
            transition: color 0.3s, border-color 0.3s;
        }

        .contact:hover {
            color: #ffffff;
            border-color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="logo">KINOGRIPS</div>
    <div class="subtitle">Camera Cranes &amp; Grip Rental</div>
    <a href="mailto:info@kinogrips.com" class="contact">info@kinogrips.com</a>

</body>
</html>
